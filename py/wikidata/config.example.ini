; Copy this file to py/config.ini and fill it in. config.ini must never be
; committed -- add it to .gitignore before you put a password in it.
;
; Only the push step reads this. reconcile, vocab and sparql need no
; credentials: they only read, from the public query service.
;
; Credentials can also come from the environment, which wins over this file:
;   WIKIDATA_USERNAME, WIKIDATA_PASSWORD

[wikidata]
; Bot password from Special:BotPasswords. The username then looks like
; "MainAccount@botname". Do not put your ordinary password here.
username = YOUR_ACCOUNT@openarchaeo-bot
password = YOUR_BOT_PASSWORD

; Required. Wikidata's User-Agent policy expects a real contact address, and
; push refuses to run while this still contains the word "contact".
user_agent = open-archaeo-wikidata/0.1 (https://github.com/n4o-rse/open-archaeo; you@example.org)

; Seconds between writes. One second is a deliberate default: this writes to
; the live Wikidata, not to a private Wikibase, and there is no hurry.
throttle_seconds = 1.0
